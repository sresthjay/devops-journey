name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up QEMU (Emulation for ARM)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # 3. Set up Docker Buildx (The engine that builds multi-arch images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build and Push Multi-Arch Image
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # <-- This is the magic line
          push: true
          tags: sresthjay/my-python-app:latest

      # 6. Deploy to EC2 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Stop and remove old container
            sudo docker stop my-cloud-app || true
            sudo docker rm my-cloud-app || true
            
            # Pull the new image (Docker Hub will auto-select arm64 for your server)
            sudo docker pull --no-cache sresthjay/my-python-app:latest
            
            # Run new container
            sudo docker run -d --name my-cloud-app -p 8080:8080 sresthjay/my-python-app:latest
            
            # Verify
            sudo docker ps
