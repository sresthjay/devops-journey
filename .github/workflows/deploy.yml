name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ] # Trigger this when code is pushed to 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest # Run this job on a fresh Linux runner

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and Push the Image
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: sresthjay/my-python-app:latest

      # 5. Update the EC2 Server (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Stop old container
            sudo docker stop my-cloud-app || true
            sudo docker rm my-cloud-app || true
            # Pull new image
            sudo docker pull sresthjay/my-python-app:latest
            # Run new container
            sudo docker run -d --name my-cloud-app -p 8080:8080 sresthjay/my-python-app
