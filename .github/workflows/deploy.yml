name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push Multi-Arch Image
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: sresthjay/my-python-app:latest

      # 4. Deploy to EC2 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Stop and remove old container (ignore errors if it doesn't exist)
            sudo docker stop my-cloud-app || true
            sudo docker rm my-cloud-app || true
            
            # Force pull the latest multi-arch image
            sudo docker pull --no-cache sresthjay/my-python-app:latest
            
            # Run new container
            sudo docker run -d --name my-cloud-app -p 8080:8080 sresthjay/my-python-app:latest
            
            # Verify it's running
            sudo docker ps
