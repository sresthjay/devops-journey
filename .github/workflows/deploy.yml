name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and Push the Image
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sresthjay/my-python-app:latest

      # 5. Update the EC2 Server
      - name: Update Container
        env:
          CONTAINER_NAME: my-cloud-app
          IMAGE_NAME: sresthjay/my-python-app:latest
          PUBLIC_IP: ${{ secrets.EC2_HOST }}

        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$PUBLIC_IP "
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            sudo docker pull $IMAGE_NAME
            sudo docker run -d --name $CONTAINER_NAME -p 8080:8080 $IMAGE_NAME
          "
